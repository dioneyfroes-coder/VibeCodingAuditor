schema_version = 1

[project]
name = "projeto-sem-referencias"

[scan]
include = ["crates/**/*.rs"]
exclude = []

[architecture]
style = "modular_monolith"

[[architecture.modules]]
name = "domain"
path = "crates/domain/**"
responsibility = "Modelos e regras centrais"
allowed_dependencies = []

[[architecture.modules]]
name = "application"
path = "crates/application/**"
responsibility = "Casos de uso e coordenacao"
allowed_dependencies = ["domain"]

[[architecture.modules]]
name = "orphan"
path = "crates/orphan/**"
responsibility = "Modulo isolado sem referencias no grafo"
allowed_dependencies = []
