[workspace]
resolver = "2"
members = ["crates/auditor-core", "crates/auditor-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.10", default-features = false, features = ["full", "parsing"] }
toml = "1.2.3"
