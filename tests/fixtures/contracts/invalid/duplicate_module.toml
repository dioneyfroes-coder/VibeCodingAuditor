schema_version = 1

[project]
name = "x"

[scan]
include = ["**/*.rs"]
exclude = []

[architecture]
style = "modular_monolith"

[[architecture.modules]]
name = "domain"
path = "src/domain/**"
responsibility = "Dominio"
allowed_dependencies = []

[[architecture.modules]]
name = "domain"
path = "src/outro-dominio/**"
responsibility = "Outro dominio"
allowed_dependencies = []
