schema_version = 1

[project]
name = "projeto-cobertura-parcial"

[scan]
include = ["src/**/*"]
exclude = []

[architecture]
style = "modular_monolith"

[[architecture.modules]]
name = "domain"
path = "src/domain/**"
responsibility = "Regras centrais"
allowed_dependencies = []

[[architecture.modules]]
name = "application"
path = "src/application/**"
responsibility = "Casos de uso"
allowed_dependencies = ["domain"]
