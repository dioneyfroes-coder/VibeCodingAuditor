schema_version = 1

[project]
name = "projeto-workspace-glob-nao-suportado"

[scan]
include = ["**/*.rs"]
exclude = []

[architecture]
style = "modular_monolith"

[[architecture.modules]]
name = "domain"
path = "crates/alpha/**/*.rs"
responsibility = "Módulo usado para validar limitações de glob"
allowed_dependencies = []

[[architecture.modules]]
name = "application"
path = "crates/beta/**/*.rs"
responsibility = "Módulo de origem da aresta determinística da fixture"
allowed_dependencies = ["domain"]
