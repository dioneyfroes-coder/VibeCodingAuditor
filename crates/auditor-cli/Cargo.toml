[package]
name = "auditor-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "vibe-coding-auditor"
path = "src/main.rs"

[dependencies]
# Limite arquitetural explícito: a CLI depende do núcleo e não implementa regras.
# Desde a Etapa 2 a CLI usa o núcleo para contrato, descoberta e análise.
auditor-core = { path = "../auditor-core" }
clap = { workspace = true }
