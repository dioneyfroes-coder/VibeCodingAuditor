schema_version = 1

[project]
name = "projeto-python"

[scan]
include = ["src/**/*.py"]
exclude = []

[architecture]
style = "modular_monolith"

[[architecture.modules]]
name = "domain"
path = "src/domain/**"
responsibility = "Modelos e regras centrais"
allowed_dependencies = []

[[architecture.modules]]
name = "application"
path = "src/application/**"
responsibility = "Casos de uso e coordenacao"
allowed_dependencies = ["domain"]

[[architecture.modules]]
name = "infrastructure"
path = "src/infrastructure/**"
responsibility = "Adaptadores de entrada e saida"
allowed_dependencies = ["domain"]
