schema_version = 1

[project]
name = "projeto-dependencias"

[scan]
include = ["**/*.rs"]
exclude = []

[architecture]
style = "modular_monolith"

[[architecture.modules]]
name = "domain"
path = "crates/domain/src/**"
responsibility = "Modelos e regras centrais"
allowed_dependencies = []

[[architecture.modules]]
name = "application"
path = "crates/application/src/**"
responsibility = "Casos de uso e coordenação"
allowed_dependencies = ["domain"]

[[architecture.modules]]
name = "infrastructure"
path = "infra/src/**"
responsibility = "Acesso a serviços externos"
allowed_dependencies = ["domain", "application"]
