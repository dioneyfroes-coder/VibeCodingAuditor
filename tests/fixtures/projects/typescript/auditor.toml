schema_version = 1

[project]
name = "projeto-typescript"

[scan]
include = ["src/**/*.ts", "src/**/*.tsx", "src/**/*.js", "src/**/*.jsx"]
exclude = []

[architecture]
style = "modular_monolith"

[[architecture.modules]]
name = "domain"
path = "src/domain/**"
responsibility = "Modelos e regras centrais"
allowed_dependencies = []

[[architecture.modules]]
name = "application"
path = "src/application/**"
responsibility = "Casos de uso e coordenação"
allowed_dependencies = ["domain"]

[[architecture.modules]]
name = "infrastructure"
path = "src/infrastructure/**"
responsibility = "Adaptadores de entrada e saída"
allowed_dependencies = ["domain"]
