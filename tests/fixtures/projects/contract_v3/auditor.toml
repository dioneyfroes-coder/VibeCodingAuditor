schema_version = 3

[project]
name = "projeto-v3"

[scan]
include = ["src/**/*.rs"]
exclude = []

[architecture]
style = "modular_monolith"

[[architecture.modules]]
name = "domain"
path = "src/domain/**"
responsibility = "Regras de negócio"
allowed_dependencies = ["application"]

[[architecture.modules]]
name = "application"
path = "src/application/**"
responsibility = "Casos de uso"
allowed_dependencies = ["billing"]

[[architecture.modules]]
name = "billing"
path = "src/billing/**"
responsibility = "Cobrança"
allowed_dependencies = []

[[architecture.layers]]
name = "domain"
modules = ["domain"]
allowed_dependencies = ["application"]

[[architecture.layers]]
name = "application"
modules = ["application"]
allowed_dependencies = ["billing"]

[[architecture.layers]]
name = "billing"
modules = ["billing"]
allowed_dependencies = []

[[architecture.domains]]
name = "core"
modules = ["domain"]
allowed_dependencies = ["sales"]

[[architecture.domains]]
name = "sales"
modules = ["application"]
allowed_dependencies = []

[[architecture.domains]]
name = "billing"
modules = ["billing"]
allowed_dependencies = ["sales"]

[[architecture.exceptions]]
rule = "dep.domain_not_allowed"
from = "sales"
to = "billing"
path = "src/application/service.rs"
justification = "Integração temporária revisada pelo time"
expires_on = "2026-12-31"

[[architecture.exceptions]]
rule = "no-direct-application"
from = "domain"
to = "application"
path = "src/domain/lib.rs"
justification = "Leitura transitória durante a migração"

[[architecture.rules]]
id = "no-direct-application"
scope = "module"
from = "domain"
to = "application"
severity = "needs_review"
justification = "A aplicação deve ser acionada por um caso de uso explícito"
