name: CI Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fixar Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1

      - name: Configurar Node 24.19.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            extensions/vscode/package-lock.json

      - name: Instalar dependências da desktop
        working-directory: apps/desktop
        run: npm ci

      - name: Instalar dependências da extensão
        working-directory: extensions/vscode
        run: npm ci

      - name: Verificar formatação Rust
        run: cargo fmt --check

      - name: Compilar workspace Rust
        run: cargo check --workspace

      - name: Testar workspace Rust
        run: cargo test --workspace

      - name: Verificar avisos Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testar helpers da desktop
        working-directory: apps/desktop
        run: npm test

      # O bundle Tauri está desativado; o CI valida o frontend e o crate, não empacotamento.
      - name: Compilar frontend da desktop
        working-directory: apps/desktop
        run: npm run build

      - name: Testar extensão VS Code
        working-directory: extensions/vscode
        run: npm test

  e2e:
    name: E2E Windows
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VCA_VSCODE_VERSION: '1.146.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fixar Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1

      - name: Configurar Node 24.19.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            extensions/vscode/package-lock.json

      - name: Instalar dependências da desktop
        working-directory: apps/desktop
        run: npm ci

      - name: Instalar dependências da extensão
        working-directory: extensions/vscode
        run: npm ci

      - name: Compilar CLI de release
        run: cargo build --release -p auditor-cli

      - name: Compilar aplicativo desktop
        run: npm --prefix apps/desktop run tauri build

      - name: Cache do host VS Code
        uses: actions/cache@v4
        with:
          path: extensions/vscode/.vscode-test
          key: vscode-e2e-${{ env.VCA_VSCODE_VERSION }}-${{ runner.os }}

      - name: Cache do tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.cargo\bin\tauri-driver.exe
          key: tauri-driver-2.1.0-${{ runner.os }}

      - name: Instalar tauri-driver 2.1.0 (bootstrap, até 2 tentativas)
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            cargo install tauri-driver --version 2.1.0 --locked
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 2) { throw "Falha ao instalar tauri-driver" }
            Start-Sleep -Seconds 5
          }

      - name: Detectar versão do WebView2
        id: webview2
        shell: pwsh
        run: |
          $paths = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $version = ''
          foreach ($registryPath in $paths) {
            $item = Get-ItemProperty -Path $registryPath -ErrorAction SilentlyContinue
            if ($item -and $item.pv) { $version = $item.pv; break }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache do MSEdgeDriver
        id: cache-msedgedriver
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vca-msedgedriver
          key: msedgedriver-${{ steps.webview2.outputs.version }}-${{ runner.os }}

      - name: Instalar MSEdgeDriver compatível com o WebView2
        shell: pwsh
        run: ./scripts/windows/install-msedgedriver.ps1 -EdgeVersion '${{ steps.webview2.outputs.version }}'

      - name: E2E da CLI
        run: node --test tests/e2e/cli/cli.e2e.test.mjs

      - name: E2E da extensão VS Code
        run: npm --prefix extensions/vscode run test:e2e

      - name: Verificar MSEdgeDriver no PATH
        shell: pwsh
        run: |
          where.exe msedgedriver.exe
          msedgedriver.exe --version
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { "{0} WebView2={1}" -f $_.Name, (Get-Item (Join-Path $_.FullName 'msedgewebview2.exe') -ErrorAction SilentlyContinue).VersionInfo.ProductVersion }

      - name: E2E do desktop Tauri
        env:
          VCA_EDGEDRIVER_DIR: ${{ runner.temp }}\vca-msedgedriver
          VCA_E2E_DRIVER_LOGS: '1'
        run: npm --prefix apps/desktop run test:e2e

      - name: Publicar artefatos de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-falhas
          path: |
            apps/desktop/e2e/artifacts/**
            apps/desktop/logs/**
            extensions/vscode/.vscode-test/**/*.log
          if-no-files-found: ignore
          retention-days: 7
